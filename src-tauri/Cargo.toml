[package]
name = "nexus"
version = "0.1.0"
description = "Nexus - all-in-one game launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "rt", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
rand = "0.8"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
