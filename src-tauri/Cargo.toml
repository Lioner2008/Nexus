[package]
name = "nexus"
version = "0.4.0"
description = "Nexus - all-in-one game launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "rt", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
rand = "0.8"
sha2 = "0.10"
tauri-plugin-dialog = "2"
# covers and banners are shrunk when they are downloaded: far less memory in the web view
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# lets the web view release memory while the window is hidden or minimized
webview2-com = "0.39"
windows = "0.62"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
