[package]
name = "nexus-server"
version = "0.4.0"
edition = "2021"
description = "Nexus social server: accounts, chat rooms, voice/video call signaling, TURN relay"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
futures-util = "0.3"
# call relay so voice/video also works between different networks
turn = "0.17"
util = { package = "webrtc-util", version = "0.17", default-features = false, features = ["conn", "vnet"] }
# automatic port forwarding on the router (UPnP)
igd-next = { version = "0.18", features = ["aio_tokio"] }

[profile.release]
strip = true
