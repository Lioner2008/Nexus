<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090b">
<title>Nexus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" hidden></div>

<!-- ───────── login / create account ───────── -->
<section id="login" class="screen">
  <div class="login-card">
    <div class="logo">N</div>
    <h1>NEXUS</h1>
    <p class="sub">Chat and talk with your friends</p>
    <div class="seg" id="mode"><button class="on" data-m="login">Log in</button><button data-m="register">Create account</button></div>
    <label>Server<input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://address:7777"></label>
    <label>Username<input id="user" autocapitalize="off" autocorrect="off" autocomplete="username" spellcheck="false" maxlength="24"></label>
    <label>Password<input id="pass" type="password" autocomplete="current-password" maxlength="200"></label>
    <label id="invite-box" hidden>Invite code<input id="invite" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="40"></label>
    <div class="err" id="err"></div>
    <button class="primary" id="go">LOG IN</button>
  </div>
</section>

<!-- ───────── app ───────── -->
<section id="main" class="screen" hidden>
  <header class="top">
    <div class="me"><div class="av" id="me-av"></div><div><b id="me-name"></b><small id="me-sub"></small></div></div>
    <button class="icon" id="btn-logout" aria-label="Log out"><svg viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </header>

  <div id="call-bar" hidden>
    <i class="live"></i><b id="call-name"></b><span class="sp"></span>
    <button class="round" id="cb-mute" aria-label="Mute"></button>
    <button class="round red" id="cb-leave" aria-label="Leave"><svg viewBox="0 0 24 24"><path d="M3 15c5-5 13-5 18 0l-2.2 2.6-3.3-1.6v-2.6c-2.2-.6-4.8-.6-7 0v2.6l-3.3 1.6z"/></svg></button>
  </div>

  <div class="pane" id="p-chat">
    <div class="rooms" id="rooms"></div>
    <div class="msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Message" maxlength="4000"></textarea>
      <button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
    </form>
  </div>

  <div class="pane" id="p-talk" hidden>
    <div id="talk"></div>
  </div>

  <div class="pane" id="p-people" hidden>
    <div id="people"></div>
  </div>

  <nav class="tabs">
    <button data-tab="chat" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat<i class="dot" id="d-chat"></i></button>
    <button data-tab="talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Talk</button>
    <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11a3 3 0 1 0 0-6M18 14.5a6 6 0 0 1 3.5 5.5"/></svg>People</button>
  </nav>
</section>

<!-- incoming call -->
<div id="ring" hidden>
  <div class="ring-card">
    <div id="ring-av"></div>
    <b id="ring-name"></b>
    <small>Incoming call</small>
    <div class="ring-btns">
      <button class="round red big" id="ring-no" aria-label="Decline"><svg viewBox="0 0 24 24"><path d="M3 15c5-5 13-5 18 0l-2.2 2.6-3.3-1.6v-2.6c-2.2-.6-4.8-.6-7 0v2.6l-3.3 1.6z"/></svg></button>
      <button class="round green big" id="ring-yes" aria-label="Accept"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
    </div>
  </div>
</div>

<div id="audio" hidden></div>
<script src="app.js"></script>
</body>
</html>
