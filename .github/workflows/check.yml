name: Check

# Every push to a branch other than main: unit tests of launcher and server, a release build and the
# installer as a downloadable artifact (for trying a version before it becomes a release), plus the
# static Linux server build used by the Pterodactyl egg.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  # Static Linux x86_64 build of the server: the Pterodactyl egg (pterodactyl/) downloads it from the release.
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: musl

      - name: Build nexus-server (static, musl)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          cargo build --release --locked --manifest-path server/Cargo.toml --target x86_64-unknown-linux-musl
          cp server/target/x86_64-unknown-linux-musl/release/nexus-server nexus-server-linux-x64
          ./nexus-server-linux-x64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-server-linux-x64
          path: nexus-server-linux-x64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            server
            installer

      - name: UI scripts parse
        shell: bash
        run: |
          for f in ui/*.js; do node --check "$f" || exit 1; done

      # compiler errors are turned into annotations so they show up on the run page
      - name: Launcher tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --message-format=short 2>&1 | tee test.log || {
            grep -E 'error(\[E[0-9]+\])?:|panicked|FAILED|failed' test.log | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Server tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path server/Cargo.toml --message-format=short 2>&1 | tee server.log || {
            grep -E 'error(\[E[0-9]+\])?:|panicked|FAILED' server.log | head -40 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Build installer (builds launcher and server first)
        shell: pwsh
        run: ./installer/build.ps1

      - name: Warnings
        shell: bash
        run: |
          grep -E 'warning:' test.log | sort -u | head -30 | while read -r l; do echo "::warning::$l"; done || true

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: nexus-test-build
          path: |
            release/*.exe
            src-tauri/target/release/nexus.exe
            server/target/release/nexus-server.exe
