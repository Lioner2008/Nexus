name: Android

# Builds the Nexus mobile app (chat + talk) as an installable APK.
#   tag  mobile-v0.1.0  -> publishes a GitHub pre-release with Nexus-Mobile-v0.1.0.apk
#   "Run workflow"      -> builds the APK and keeps it as a workflow artifact
# (a pre-release, so the desktop updater - which reads the latest *release* - is not confused by it)
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android

      - name: Permissions (microphone, camera) and plain http/ws to the Nexus server
        working-directory: mobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$M"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          grep -E "uses-permission|usesCleartextTraffic" "$M"

      - name: Version from the tag
        if: github.ref_type == 'tag'
        working-directory: mobile
        run: |
          VER="${GITHUB_REF_NAME#mobile-v}"
          CODE=$(echo "$VER" | awk -F. '{ printf "%d", $1*10000 + $2*100 + $3 }')
          sed -i "s/versionName \".*\"/versionName \"$VER\"/; s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Sync the web app into the project
        working-directory: mobile
        run: npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VER="${GITHUB_REF_NAME#mobile-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER="dev"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "Nexus-Mobile-v$VER.apk"
          sha256sum "Nexus-Mobile-v$VER.apk" | tee SHA256SUMS-mobile.txt
          ls -l *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-mobile-apk
          path: |
            Nexus-Mobile-*.apk
            SHA256SUMS-mobile.txt

      - name: Publish
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            Nexus-Mobile-*.apk
            SHA256SUMS-mobile.txt
          body: |
            **Nexus for Android** – chat and talk (voice rooms and calls) with your friends on the same Nexus server.

            **Install:** download the `.apk`, open it on your phone and allow "install from this source" when Android asks.
            On first start enter the server address (`http://address:7777`) and log in – or create an account (with the invite code if the server needs one).
            Allow the microphone when you join a voice room (and the camera if you turn video on). The screen stays on during a call.
